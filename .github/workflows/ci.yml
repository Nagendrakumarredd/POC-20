name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poc-20:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/poc-20:${{ github.sha }}

      - name: Clone Manifest Repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Nagendrakumarredd/poc20-manifests.git

      - name: Update Deployment
        run: |
          cd poc20-manifests
          sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/poc-20:${{ github.sha }}|" deployment.yaml

      - name: Commit & Push
        run: |
          cd poc20-manifests
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update image tag" || echo "No changes to commit"
          git push
